name: Publish Quarto note to gh-pages

on:
  push:
    branches: [python]
  workflow_dispatch: {}
  # Re-build the site weekly so a stale quarto/python mirror in the runner cannot hide a break.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write   # the deploy step pushes the gh-pages branch with GITHUB_TOKEN
  pages: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render index.qmd and deploy _site/ to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the modelling stack (numpy, pandas, matplotlib, scikit-learn, ipykernel)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ipykernel ships a `python3` kernelspec in the interpreter's prefix, so Quarto
      # finds exactly this interpreter when the note says `jupyter: python3`.
      - name: Check the Jupyter kernel Quarto will use
        run: |
          jupyter kernelspec list
          python -c "import sklearn, pandas, numpy, matplotlib; print(sklearn.__version__, pandas.__version__, numpy.__version__, matplotlib.__version__)"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        env:
          QUARTO_LOG_LEVEL: INFO
        run: quarto render index.qmd

      - name: Upload the site as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site
          path: _site
          retention-days: 7

      - name: Deploy to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          destination_dir: ./
          commit_message: "site: deploy ${{ github.sha }}"
